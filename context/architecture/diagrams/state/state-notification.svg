amily="Arial" font-size="13" lengthAdjust="spacing" textLength="185.6245" x="127.5" y="260.9849">- Informasi umum sistem (INFO)</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="26" id="ent0014"><path d="M129.5,375.0986 L129.5,421.0986 L94.1,425.0986 L129.5,429.0986 L129.5,474.791 A0,0 0 0 0 129.5,474.791 L441.8828,474.791 A0,0 0 0 0 441.8828,474.791 L441.8828,385.0986 L431.8828,375.0986 L129.5,375.0986 A0,0 0 0 0 129.5,375.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M431.8828,375.0986 L431.8828,385.0986 L441.8828,385.0986 L431.8828,375.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="78.0381" x="135.5" y="392.2925">Field relevan:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="90.6826" x="135.5" y="407.2412">- isRead = false</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.3828" x="135.5" y="422.1899">- relatedEntityType = "DocumentRecord" (jika ada)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="196.9043" x="135.5" y="437.1387">- relatedEntityId = id entitas terkait</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="171.2534" x="135.5" y="452.0874">Notifikasi ditampilkan sebagai</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="149.4111" x="135.5" y="467.0361">"belum dibaca" di UI user.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="35" id="ent0017"><path d="M122,596.0986 L122,642.0986 L86.85,646.0986 L122,650.0986 L122,695.791 A0,0 0 0 0 122,695.791 L374.9434,695.791 A0,0 0 0 0 374.9434,695.791 L374.9434,606.0986 L364.9434,596.0986 L122,596.0986 A0,0 0 0 0 122,596.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M364.943