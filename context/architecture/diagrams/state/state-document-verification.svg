<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="618px" preserveAspectRatio="none" style="width:954px;height:618px;background:#FFFFFF;" version="1.1" viewBox="0 0 954 618" width="954px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="5"><text fill="#000000" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="367.9785" x="289.9128" y="23.1318">SIMDP - State Diagram: DocumentVerification Lifecycle</text><text fill="#000000" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="327.5371" x="310.1335" y="39.2305">(Kode Verifikasi Publik Profil / Sertifikat Pegawai)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="7" id="ent0001"><ellipse cx="292.5" cy="69.1973" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="AKTIF" data-source-line="7" id="ent0002"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="59.6689" x="262.5" y="210.1973"/><line style="stroke:#181818;stroke-width:0.5;" x1="262.5" x2="322.1689" y1="236.2959" y2="236.2959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="39.6689" x="272.5" y="228.3291">AKTIF</text></g><g class="entity" data-qualified-name="DICABUT" data-source-line="11" id="ent0005"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="81.4482" x="7" y="408.6973"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="88.4482" y1="434.7959" y2="434.7959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="61.4482" x="17" y="426.8291">DICABUT</text></g><g class="entity" data-qualified-name="KADALUARSA" data-source-line="13" id="ent0007"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="114.1445" x="482.5" y="408.6973"/><line style="stroke:#181818;stroke-width:0.5;" x1="482.5" x2="596.6445" y1="434.7959" y2="434.7959"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="94.1445" x="492.5" y="426.8291">KADALUARSA</text></g><g class="end_entity" data-qualified-name=".end." data-source-line="15" id="ent0009"><ellipse cx="293.5" cy="593.1973" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="293.5" cy="593.1973" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN12" data-source-line="20" id="ent0013"><path d="M611,185.1973 L611,231.1973 L322.69,235.1973 L611,239.1973 L611,284.8896 A0,0 0 0 0 611,284.8896 L939.8042,284.8896 A0,0 0 0 0 939.8042,284.8896 L939.8042,195.1973 L929.8042,185.1973 L611,185.1973 A0,0 0 0 0 611,185.1973" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M929.8042,185.1973 L929.8042,195.1973 L939.8042,195.1973 L929.8042,185.1973" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="102.6035" x="617" y="202.3911">Saat kode AKTIF:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="269.5405" x="617" y="217.3398">- Pihak luar (tanpa login) dapat memindai kode</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.8042" x="617" y="232.2886">- Sistem mengembalikan data profil minimal pegawai:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="136.5698" x="624.2236" y="247.2373">nama, NIP/NIK, jabatan</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1714" x="617" y="262.186">- Setiap pemindaian TIDAK mengubah state kode</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="262.2788" x="617" y="277.1348">- Kode bisa dipakai berkali-kali selama AKTIF</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="29" id="ent0016"><path d="M123.5,391.1973 L123.5,429.6973 L88.41,433.6973 L123.5,437.6973 L123.5,475.9409 A0,0 0 0 0 123.5,475.9409 L447.2896,475.9409 A0,0 0 0 0 447.2896,475.9409 L447.2896,401.1973 L437.2896,391.1973 L123.5,391.1973 A0,0 0 0 0 123.5,391.1973" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M437.2896,391.1973 L437.2896,401.1973 L447.2896,401.1973 L437.2896,391.1973" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.0151" x="129.5" y="408.3911">Contoh alasan pencabutan:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="155.3652" x="129.5" y="423.3398">- Pegawai sudah tidak aktif</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.0342" x="129.5" y="438.2886">- Sertifikat/dokumen yang mendasari tidak berlaku</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="198.0342" x="129.5" y="453.2373">- Kode bocor atau disalahgunakan</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="302.7896" x="129.5" y="468.186">revokedAt dan revokeReason tersimpan untuk audit.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="37" id="ent0019"><path d="M631.5,391.1973 L631.5,429.6973 L596.69,433.6973 L631.5,437.6973 L631.5,475.9409 A0,0 0 0 0 631.5,475.9409 L901.106,475.9409 A0,0 0 0 0 901.106,475.9409 L901.106,401.1973 L891.106,391.1973 L631.5,391.1973 A0,0 0 0 0 631.5,391.1973" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M891.106,391.1973 L891.106,401.1973 L901.106,401.1973 L891.106,391.1973" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.167" x="637.5" y="408.3911">Jika expiresAt di-set saat penerbitan,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="248.606" x="637.5" y="423.3398">kode otomatis tidak bisa digunakan setelah</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8462" x="637.5" y="438.2886">tanggal tersebut.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="132.5835" x="637.5" y="453.2373">Jika expiresAt = NULL,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="232.7114" x="637.5" y="468.186">kode berlaku selamanya hingga dicabut.</text></g><!--link *start* to AKTIF--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="7" id="lnk3"><path d="M292.5,79.4873 C292.5,104.3573 292.5,168.0573 292.5,204.9873" fill="none" id="*start*-to-AKTIF" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="292.5,209.9873,296.5,200.9873,292.5,204.9873,288.5,200.9873,292.5,209.9873" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="235.5488" x="327.4758" y="122.3911">Admin / Staff menerbitkan kode verifikasi</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5005" x="293.5" y="137.3398">(DocumentVerification dibuat, kode unik di-generate)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="184.2407" x="353.1299" y="152.2886">[POST /api/v1/verification/issue]</text></g><!--link AKTIF to AKTIF--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk4"><path d="M322.59,217.2673 C340.57,213.2873 357.5,219.2573 357.5,235.1973 C357.5,251.1373 345.4518,258.1879 327.4718,254.2079" fill="none" id="AKTIF-to-AKTIF" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="322.59,253.1273,330.5128,258.9779,327.4718,254.2079,332.2418,251.1669,322.59,253.1273" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="223.9771" x="363.5" y="217.8911">Pihak luar memindai / memeriksa kode</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="184.958" x="383.0095" y="232.8398">(GET /api/v1/public/verify/:code)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="171.5835" x="389.6968" y="247.7886">&#8594; Sistem merespons: valid &#10003;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="117.7998" x="416.5886" y="262.7373">[state tidak berubah]</text></g><!--link AKTIF to DICABUT--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="11" id="lnk6"><path d="M262.31,258.2573 C241.14,273.8673 212.32,295.4673 187.5,315.1973 C147.88,346.6873 107.0717,381.298 79.0817,405.358" fill="none" id="AKTIF-to-DICABUT" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="75.29,408.6173,84.7225,405.7839,79.0817,405.358,79.5076,399.7172,75.29,408.6173" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="259.4033" x="188.5" y="328.3911">Admin / Staff mencabut kode secara eksplisit</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="217.4834" x="209.46" y="343.3398">(revokedAt diisi, revokeReason wajib)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="210.2534" x="213.075" y="358.2886">[POST /api/v1/verification/:id/revoke]</text></g><!--link AKTIF to KADALUARSA--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="13" id="lnk8"><path d="M322.67,246.1773 C356.81,258.5173 412.8,282.0273 452.5,315.1973 C484.44,341.8873 508.6376,378.2901 523.7176,404.1001" fill="none" id="AKTIF-to-KADALUARSA" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="526.24,408.4173,525.1534,398.6285,523.7176,404.1001,518.246,402.6643,526.24,408.4173" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="112.728" x="595.1262" y="328.3911">Masa berlaku habis</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="149.9063" x="576.5371" y="343.3398">(expiresAt &lt; SEKARANG)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.9805" x="494.5" y="358.2886">[Jika expiresAt = NULL, kode tidak pernah kadaluarsa]</text></g><!--link DICABUT to *end*--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" data-source-line="15" id="lnk10"><path d="M74.04,458.8773 C103.04,484.4273 151.64,524.7473 198.5,552.1973 C227.53,569.1973 260.4198,581.2166 278.3598,587.2366" fill="none" id="DICABUT-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="283.1,588.8273,275.8401,582.1719,278.3598,587.2366,273.2951,589.7563,283.1,588.8273" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="90.3145" x="276.4685" y="519.3911">Status terminal.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLengt